<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - NaoTraders</title>
    <link rel="icon" type="image/jpeg" href="/naotraders.jpeg" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00e699;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .text {
            font-size: 15px;
            color: #94a3b8;
            letter-spacing: 0.3px;
        }
    </style>
    <script>
        (function() {
            try {
                var search = window.location.search || '';
                var hash = window.location.hash || '';
                window.location.replace(window.location.origin + '/' + search + hash);
            } catch (e) {
                window.location.href = '/' + window.location.search + window.location.hash;
            }
        })();
    </script>
</head>
<body>
    <div class="spinner"></div>
    <div class="text">Authenticating with NaoTraders...</div>
</body>
</html>
